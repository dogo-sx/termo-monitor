<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Monitoramento</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* VISUAL INSPIRADO NO 1.1.1.1 (CLOUDFLARE WARP) */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #101010;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 360px;
        }

        .logo {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -1px;
            line-height: 1.2;
            margin-bottom: 5px;
            background: linear-gradient(135deg, #ff6b4a, #ff4071);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitulo {
            font-size: 14px;
            color: #888888;
            margin-bottom: 30px;
            font-weight: 400;
        }

        /* TELA DE LOGIN */
        #tela-login {
            background-color: #1a1a1a;
            border: 1px solid #2a2a2a;
            padding: 30px 20px;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .input-senha {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: 1px solid #333;
            background-color: #101010;
            color: #fff;
            font-size: 18px;
            text-align: center;
            box-sizing: border-box;
            margin-bottom: 15px;
            outline: none;
            letter-spacing: 4px;
        }

        .input-senha:focus {
            border-color: #ff6b4a;
        }

        .btn-entrar {
            width: 100%;
            background: linear-gradient(135deg, #ff6b4a, #ff4071);
            color: white;
            border: none;
            padding: 14px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .btn-entrar:active {
            transform: scale(0.98);
        }

        /* PAINEL DE DADOS (Inicia Oculto) */
        #painel-principal {
            display: none;
        }

        .card-principal {
            background-color: #1a1a1a;
            border: 1px solid #2a2a2a;
            padding: 40px 20px;
            border-radius: 28px;
            margin-bottom: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .label-atual {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ff6b4a;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .display-temperatura {
            font-size: 62px;
            font-weight: 800;
            letter-spacing: -2px;
            margin: 0;
            color: #ffffff;
        }

        .grid-status {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .mini-card {
            background-color: #161616;
            border: 1px solid #222222;
            padding: 15px;
            border-radius: 18px;
            text-align: left;
            display: flex;
            flex-direction: column;
        }

        .mini-label {
            font-size: 11px;
            color: #666666;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .mini-valor {
            font-size: 20px;
            font-weight: 700;
        }

        .mini-hora {
            font-size: 12px;
            color: #888888;
            margin-top: 4px;
            font-weight: 500;
        }

        #max-valor { color: #ff4071; }
        #min-valor { color: #00d2ff; }

        .btn-reset {
            width: 100%;
            background-color: #221515;
            color: #ff5252;
            border: 1px solid #3a1c1c;
            padding: 14px 20px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 18px;
            cursor: pointer;
            margin-bottom: 25px;
            transition: all 0.2s ease;
        }

        .btn-reset:hover {
            background-color: #ff5252;
            color: #ffffff;
            border-color: #ff5252;
        }

        .footer-status {
            font-size: 13px;
            color: #666666;
            line-height: 1.6;
        }

        .fonte-dados {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #1f1f1f;
            font-size: 11px;
            color: #555555;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .fonte-dados span { color: #3ecf8e; font-weight: 700; }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">Sistema de Monitoramento Remoto de Temperatura</div>
        <div class="subtitulo">Connected to Supabase Realtime</div>

        <div id="tela-login">
            <div class="label-atual" style="margin-bottom: 20px;">🔒 Acesso Restrito</div>
            <input type="password" id="campo-senha" class="input-senha" placeholder="Digite a senha" onkeypress="checarEnter(event)">
            <button class="btn-entrar" onclick="validarSenha()">Entrar no Painel</button>
        </div>

        <div id="painel-principal">
            <div class="card-principal">
                <div class="label-atual">Temperatura Atual</div>
                <div class="display-temperatura" id="temp-atual">...°C</div>
            </div>

            <div class="grid-status">
                <div class="mini-card">
                    <div class="mini-label">🔺 Pico de Calor</div>
                    <div class="mini-valor" id="max-valor">...°C</div>
                    <div class="mini-hora" id="max-hora">--:--</div>
                </div>
                <div class="mini-card">
                    <div class="mini-label">🔹 Pico de Frio</div>
                    <div class="mini-valor" id="min-valor">...°C</div>
                    <div class="mini-hora" id="min-hora">--:--</div>
                </div>
            </div>

            <button class="btn-reset" onclick="limparBanco()">
                🗑️ Resetar Leituras do Banco
            </button>

            <div class="footer-status">
                Desenvolvido por Raphael Furtado da Silva<br>
                Bolsista CNPq<br>
                2026
                
                <div class="fonte-dados">
                    Fonte de Dados: <span>⚡ Supabase Database</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // SENHA MESTRA DEFINIDA
        const SENHA_MESTRA = "0101";

        const SUPABASE_URL = "https://wfhwtuopsyzdygmzxhay.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndmaHd0dW9wc3l6ZHlnbXp4aGF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ1MzQ5NTgsImV4cCI6MjEwMDExMDk1OH0._MrU4Ho80BTBZVI-Bmf_H_F9HnEJ082jC-9HwswQn2A";

        const bancoDados = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let historico = [];

        function validarSenha() {
            const senhaDigitada = document.getElementById('campo-senha').value.trim();
            if (senhaDigitada === SENHA_MESTRA) {
                sessionStorage.setItem('autenticado', 'true');
                mostrarPainel();
            } else {
                alert("❌ Senha incorreta! Acesso negado.");
                document.getElementById('campo-senha').value = "";
            }
        }

        function checarEnter(event) {
            if (event.key === "Enter") {
                validarSenha();
            }
        }

        function mostrarPainel() {
            document.getElementById('tela-login').style.display = 'none';
            document.getElementById('painel-principal').style.display = 'block';
            carregarDadosIniciais();
            iniciarRealtime();
        }

        // Mantém a sessão aberta na mesma aba do navegador enquanto ela não for fechada
        if (sessionStorage.getItem('autenticado') === 'true') {
            mostrarPainel();
        }

        function formatarHora(dataISO) {
            if (!dataISO) return "--:--";
            const data = new Date(dataISO);
            return data.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        }

        function calcularEAtualizar() {
            if (historico.length > 0) {
                const registroAtual = historico[historico.length - 1];
                document.getElementById('temp-atual').innerText = registroAtual.temperatura.toFixed(1) + "°C";

                let maxObj = historico[0];
                let minObj = historico[0];

                for (let i = 1; i < historico.length; i++) {
                    if (historico[i].temperatura > maxObj.temperatura) {
                        maxObj = historico[i];
                    }
                    if (historico[i].temperatura < minObj.temperatura) {
                        minObj = historico[i];
                    }
                }

                document.getElementById('max-valor').innerText = maxObj.temperatura.toFixed(1) + "°C";
                document.getElementById('max-hora').innerText = "às " + formatarHora(maxObj.created_at);

                document.getElementById('min-valor').innerText = minObj.temperatura.toFixed(1) + "°C";
                document.getElementById('min-hora').innerText = "às " + formatarHora(minObj.created_at);
            } else {
                document.getElementById('temp-atual').innerText = "...°C";
                document.getElementById('max-valor').innerText = "...°C";
                document.getElementById('max-hora').innerText = "--:--";
                document.getElementById('min-valor').innerText = "...°C";
                document.getElementById('min-hora').innerText = "--:--";
            }
        }

        async function carregarDadosIniciais() {
            let { data, error } = await bancoDados
                .from('leituras')
                .select('*')
                .order('created_at', { ascending: true })
                .limit(100);

            if (data && data.length > 0) {
                historico = data;
                calcularEAtualizar();
            }
        }

        async function limparBanco() {
            if (!confirm("Deseja realmente apagar todo o histórico de leituras do Supabase?")) return;

            const { error } = await bancoDados
                .from('leituras')
                .delete()
                .neq('temperatura', -999);

            if (error) {
                alert("❌ Não foi possível apagar. Verifique as regras de DELETE no Supabase.");
            } else {
                alert("✅ Leituras apagadas!");
                historico = [];
                calcularEAtualizar();
            }
        }

        function iniciarRealtime() {
            bancoDados
                .channel('custom-insert-channel')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'leituras' }, (payload) => {
                    historico.push(payload.new);
                    calcularEAtualizar();
                })
                .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'leituras' }, () => {
                    historico = [];
                    calcularEAtualizar();
                })
                .subscribe();
        }
    </script>
</body>
</html>
