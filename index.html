<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Monitoramento</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* VISUAL INSPIRADO NO 1.1.1.1 (CLOUDFLARE WARP) */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #101010;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 360px;
        }

        .logo {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -1px;
            line-height: 1.2;
            margin-bottom: 5px;
            background: linear-gradient(135deg, #ff6b4a, #ff4071);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitulo {
            font-size: 14px;
            color: #888888;
            margin-bottom: 40px;
            font-weight: 400;
        }

        /* O Bloco Central - Temperatura Atual */
        .card-principal {
            background-color: #1a1a1a;
            border: 1px solid #2a2a2a;
            padding: 40px 20px;
            border-radius: 28px;
            margin-bottom: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            transition: border-color 0.3s;
        }

        .card-principal:hover {
            border-color: #ff5252;
        }

        .label-atual {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ff6b4a;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .display-temperatura {
            font-size: 62px;
            font-weight: 800;
            letter-spacing: -2px;
            margin: 0;
            color: #ffffff;
        }

        /* Grid de Estatísticas (Mínima e Máxima) */
        .grid-status {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .mini-card {
            background-color: #161616;
            border: 1px solid #222222;
            padding: 15px;
            border-radius: 18px;
            text-align: left;
            display: flex;
            flex-direction: column;
        }

        .mini-label {
            font-size: 11px;
            color: #666666;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .mini-valor {
            font-size: 20px;
            font-weight: 700;
        }

        .mini-hora {
            font-size: 12px;
            color: #888888;
            margin-top: 4px;
            font-weight: 500;
        }

        #max-valor { color: #ff4071; }
        #min-valor { color: #00d2ff; }

        /* ESTILO DO BOTÃO DE RESET */
        .btn-reset {
            width: 100%;
            background-color: #221515;
            color: #ff5252;
            border: 1px solid #3a1c1c;
            padding: 14px 20px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 25px;
        }

        .btn-reset:hover {
            background-color: #ff5252;
            color: #ffffff;
            border-color: #ff5252;
        }

        .btn-reset:active {
            transform: scale(0.98);
        }

        .footer-status {
            margin-top: 10px;
            font-size: 13px;
            color: #666666;
            line-height: 1.6;
        }

        /* LOGOS DO CNPq E INMETRO */
        .logos-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin: 10px 0;
        }

        .logo-instituicao {
            height: 28px;
            width: auto;
            object-fit: contain;
            filter: brightness(0.9);
        }

        .fonte-dados {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #1f1f1f;
            font-size: 11px;
            color: #555555;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .fonte-dados span {
            color: #3ecf8e;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">Sistema de Monitoramento Remoto de Temperatura</div>
        <div class="subtitulo">Connected to Supabase Realtime</div>

        <div class="card-principal">
            <div class="label-atual">Temperatura Atual</div>
            <div class="display-temperatura" id="temp-atual">...°C</div>
        </div>

        <div class="grid-status">
            <div class="mini-card">
                <div class="mini-label">🔺 Pico de Calor</div>
                <div class="mini-valor" id="max-valor">...°C</div>
                <div class="mini-hora" id="max-hora">--:--</div>
            </div>
            <div class="mini-card">
                <div class="mini-label">🔹 Pico de Frio</div>
                <div class="mini-valor" id="min-valor">...°C</div>
                <div class="mini-hora" id="min-hora">--:--</div>
            </div>
        </div>

        <button class="btn-reset" onclick="limparBancoComSenha()">
            🗑️ Resetar Leituras do Banco
        </button>

        <div class="footer-status">
            Desenvolvido por <strong>Raphael Furtado da Silva</strong><br>
            Bolsista CNPq<br>

            <div class="logos-container">
                <svg class="logo-instituicao" viewBox="0 0 300 100" xmlns="http://www.w3.org/2000/svg">
                    <text x="10" y="70" font-family="sans-serif" font-weight="900" font-size="65" fill="#0055a5">CNPq</text>
                    <path d="M 210 20 L 250 50 L 210 80 Z" fill="#2e7d32"/>
                    <path d="M 230 10 L 275 45 L 230 80 Z" fill="#fbc02d" opacity="0.8"/>
                </svg>

                <svg class="logo-instituicao" viewBox="0 0 350 100" xmlns="http://www.w3.org/2000/svg">
                    <text x="10" y="70" font-family="sans-serif" font-weight="900" font-size="58" fill="#003399" letter-spacing="-2">INMETRO</text>
                </svg>
            </div>

            2026
            
            <div class="fonte-dados">
                Fonte de Dados: <span>⚡ Supabase Database</span>
            </div>
        </div>
    </div>

    <script>
        // SENHA MESTRA PARA APAGAR OS DADOS
        const SENHA_MESTRA = "0101";

        // CONFIGURAÇÕES DO SUPABASE
        const SUPABASE_URL = "https://wfhwtuopsyzdygmzxhay.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndmaHd0dW9wc3l6ZHlnbXp4aGF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ1MzQ5NTgsImV4cCI6MjEwMDExMDk1OH0._MrU4Ho80BTBZVI-Bmf_H_F9HnEJ082jC-9HwswQn2A";

        const bancoDados = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let historico = [];

        function formatarHora(dataISO) {
            if (!dataISO) return "--:--";
            const data = new Date(dataISO);
            return data.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        }

        function calcularEAtualizar() {
            if (historico.length > 0) {
                const registroAtual = historico[historico.length - 1];
                document.getElementById('temp-atual').innerText = registroAtual.temperatura.toFixed(1) + "°C";

                let maxObj = historico[0];
                let minObj = historico[0];

                for (let i = 1; i < historico.length; i++) {
                    if (historico[i].temperatura > maxObj.temperatura) {
                        maxObj = historico[i];
                    }
                    if (historico[i].temperatura < minObj.temperatura) {
                        minObj = historico[i];
                    }
                }

                document.getElementById('max-valor').innerText = maxObj.temperatura.toFixed(1) + "°C";
                document.getElementById('max-hora').innerText = "às " + formatarHora(maxObj.created_at);

                document.getElementById('min-valor').innerText = minObj.temperatura.toFixed(1) + "°C";
                document.getElementById('min-hora').innerText = "às " + formatarHora(minObj.created_at);
            } else {
                document.getElementById('temp-atual').innerText = "...°C";
                document.getElementById('max-valor').innerText = "...°C";
                document.getElementById('max-hora').innerText = "--:--";
                document.getElementById('min-valor').innerText = "...°C";
                document.getElementById('min-hora').innerText = "--:--";
            }
        }

        async function carregarDadosIniciais() {
            let { data, error } = await bancoDados
                .from('leituras')
                .select('*')
                .order('created_at', { ascending: true })
                .limit(100);

            if (data && data.length > 0) {
                historico = data;
                calcularEAtualizar();
            } else if (error) {
                console.error("Erro ao conectar ao banco:", error);
            }
        }

        // FUNÇÃO DE EXCLUSÃO PROTEGIDA POR SENHA
        async function limparBancoComSenha() {
            const senhaInserida = prompt("🔒 Ação Restrita! Digite a senha mestra para apagar o banco:");

            if (senhaInserida === null) return;

            if (senhaInserida.trim() !== SENHA_MESTRA) {
                alert("❌ Senha incorreta! Operação cancelada.");
                return;
            }

            if (!confirm("⚠️ Atencão: Tem certeza de que deseja apagar permanentemente todas as leituras?")) return;

            const { error } = await bancoDados
                .from('leituras')
                .delete()
                .neq('temperatura', -999);

            if (error) {
                alert("❌ Erro ao apagar dados. Verifique a permissão RLS da tabela no Supabase.");
                console.error(error);
            } else {
                alert("✅ Registros do banco apagados com sucesso!");
                historico = [];
                calcularEAtualizar();
            }
        }

        // Escuta novas inserções e exclusões em tempo real
        bancoDados
            .channel('custom-insert-channel')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'leituras' }, (payload) => {
                historico.push(payload.new);
                calcularEAtualizar();
            })
            .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'leituras' }, () => {
                historico = [];
                calcularEAtualizar();
            })
            .subscribe();

        // Carrega as leituras ao abrir a página
        carregarDadosIniciais();
    </script>
</body>
</html>
