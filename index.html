<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Monitoramento</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* VISUAL INSPIRADO NO 1.1.1.1 (CLOUDFLARE WARP) */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #101010; /* Fundo escuro profundo */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 360px;
        }

        /* Título no estilo da logo 1.1.1.1 */
        .logo {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -1px;
            line-height: 1.2;
            margin-bottom: 5px;
            background: linear-gradient(135deg, #ff6b4a, #ff4071);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitulo {
            font-size: 14px;
            color: #888888;
            margin-bottom: 30px;
            font-weight: 400;
        }

        /* O Bloco Central - Temperatura Atual */
        .card-principal {
            background-color: #1a1a1a;
            border: 1px solid #2a2a2a;
            padding: 40px 20px;
            border-radius: 28px;
            margin-bottom: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            transition: border-color 0.3s;
        }

        .card-principal:hover {
            border-color: #ff5252;
        }

        .label-atual {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ff6b4a;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .display-temperatura {
            font-size: 62px;
            font-weight: 800;
            letter-spacing: -2px;
            margin: 0;
            color: #ffffff;
        }

        /* Grid de Estatísticas (Mínima e Máxima) */
        .grid-status {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .mini-card {
            background-color: #161616;
            border: 1px solid #222222;
            padding: 15px;
            border-radius: 18px;
            text-align: left;
            display: flex;
            flex-direction: column;
        }

        .mini-label {
            font-size: 11px;
            color: #666666;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .mini-valor {
            font-size: 20px;
            font-weight: 700;
        }

        .mini-hora {
            font-size: 12px;
            color: #888888;
            margin-top: 4px;
            font-weight: 500;
        }

        /* Cores dos picos */
        #max-valor { color: #ff4071; }
        #min-valor { color: #00d2ff; }

        /* ESTILO DO BOTÃO DE RESET */
        .btn-reset {
            width: 100%;
            background-color: #221515;
            color: #ff5252;
            border: 1px solid #3a1c1c;
            padding: 14px 20px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
        }

        .btn-reset:hover {
            background-color: #ff5252;
            color: #ffffff;
            border-color: #ff5252;
            box-shadow: 0 8px 20px rgba(255, 82, 82, 0.3);
        }

        .btn-reset:active {
            transform: scale(0.98);
        }

        /* RODAPÉ E FONTE DE DADOS */
        .footer-status {
            font-size: 13px;
            color: #666666;
            line-height: 1.6;
        }

        .fonte-dados {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #1f1f1f;
            font-size: 11px;
            color: #555555;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .fonte-dados span {
            color: #3ecf8e; /* Cor oficial Verde Supabase */
            font-weight: 700;
        }
    </style>
</head>
<body>
