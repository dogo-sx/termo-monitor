<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Monitoramento</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* VISUAL INSPIRADO NO 1.1.1.1 (CLOUDFLARE WARP) */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #101010;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 360px;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: -1px;
            line-height: 1.2;
            margin-bottom: 5px;
            background: linear-gradient(135deg, #ff6b4a, #ff4071);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitulo {
            font-size: 13px;
            color: #888888;
            margin-bottom: 25px;
            font-weight: 400;
        }

        .card-principal {
            background-color: #1a1a1a;
            border: 1px solid #2a2a2a;
            padding: 35px 20px;
            border-radius: 28px;
            margin-bottom: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            transition: border-color 0.3s;
        }

        .card-principal:hover {
            border-color: #ff5252;
        }

        .label-atual {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ff6b4a;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .display-temperatura {
            font-size: 58px;
            font-weight: 800;
            letter-spacing: -2px;
            margin: 0;
            color: #ffffff;
        }

        .grid-status {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .mini-card {
            background-color: #161616;
            border: 1px solid #222222;
            padding: 14px;
            border-radius: 18px;
            text-align: left;
            display: flex;
            flex-direction: column;
        }

        .mini-label {
            font-size: 10px;
            color: #666666;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .mini-valor {
            font-size: 18px;
            font-weight: 700;
        }

        .mini-hora {
            font-size: 11px;
            color: #888888;
            margin-top: 4px;
            font-weight: 500;
        }

        #max-valor { color: #ff4071; }
        #min-valor { color: #00d2ff; }

        .btn-reset {
            width: 100%;
            background-color: #221515;
            color: #ff5252;
            border: 1px solid #3a1c1c;
            padding: 12px 18px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 25px;
        }

        .btn-reset:hover {
            background-color: #ff5252;
            color: #ffffff;
            border-color: #ff5252;
        }

        .footer-status {
            font-size: 12px;
            color: #666666;
            line-height: 1.6;
        }

        .fonte-dados {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #1f1f1f;
            font-size: 11px;
            color: #555555;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .fonte-dados span {
            color: #3ecf8e;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">Sistema de Monitoramento Remoto de Temperatura</div>
        <div class="subtitulo">Connected to Supabase Realtime</div>

        <div class="card-principal">
            <div class="label-atual">Temperatura Atual</div>
            <div class="display-temperatura" id="temp-atual">--.-°C</div>
        </div>

        <div class="grid-status">
            <div class="mini-card">
                <div class="mini-label">🔺 Pico de Calor</div>
                <div class="mini-valor" id="max-valor">--.-°
