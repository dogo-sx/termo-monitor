<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Monitoramento</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* VISUAL INSPIRADO NO 1.1.1.1 (CLOUDFLARE WARP) */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #101010;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 420px;
        }

        .logo {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -1px;
            line-height: 1.2;
            margin-bottom: 5px;
            background: linear-gradient(135deg, #ff6b4a, #ff4071);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitulo {
            font-size: 14px;
            color: #888888;
            margin-bottom: 30px;
            font-weight: 400;
        }

        /* CARD PRINCIPAL */
        .card-principal {
            background-color: #1a1a1a;
            border: 1px solid #2a2a2a;
            padding: 35px 20px;
            border-radius: 28px;
            margin-bottom: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            transition: border-color 0.3s;
        }

        .card-principal:hover {
            border-color: #ff5252;
        }

        .label-atual {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ff6b4a;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .display-temperatura {
            font-size: 62px;
            font-weight: 800;
            letter-spacing: -2px;
            margin: 0;
            color: #ffffff;
        }

        /* CARD DO GRÁFICO */
        .card-grafico {
            background-color: #161616;
            border: 1px solid #222222;
            padding: 20px 15px;
            border-radius: 24px;
            margin-bottom: 20px;
            text-align: left;
        }

        .grafico-header {
            font-size: 11px;
            color: #888888;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .chart-container {
            position: relative;
            height: 180px;
            width: 100%;
        }

        /* GRID DE PICOS */
        .grid-status {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .mini-card {
            background-color: #161616;
            border: 1px solid #222222;
            padding: 15px;
            border-radius: 18px;
            text-align: left;
            display: flex;
            flex-direction: column;
        }

        .mini-label {
            font-size: 11px;
            color: #666666;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .mini-valor {
            font-size: 20px;
            font-weight: 700;
        }

        .mini-hora {
            font-size: 12px;
            color: #888888;
            margin-top: 4px;
            font-weight: 500;
        }

        #max-valor { color: #ff4071; }
        #min-valor { color: #00d2ff; }

        /* BOTÃO RESET */
        .btn-reset {
            width: 100%;
            background-color: #221515;
            color: #ff5252;
            border: 1px solid #3a1c1c;
            padding: 14px 20px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 25px;
        }

        .btn-reset:hover {
            background-color: #ff5252;
            color: #ffffff;
            border-color: #ff5252;
        }

        /* FOOTER COM LOGOTIPOS */
        .footer-status {
            font-size: 13px;
            color: #666666;
            line-height: 1.6;
        }

        .desenvolvedor-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .logos-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 6px;
        }

        .logo-instituicao {
            height: 24px;
            width: auto;
            object-fit: contain;
            filter: brightness(0.9) contrast(1.1); /* Ajuste de brilho para o tema escuro */
        }

        .fonte-dados {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #1f1f1f;
            font-size: 11px;
            color: #555555;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .fonte-dados span {
            color: #3ecf8e;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">Sistema de Monitoramento Remoto de Temperatura</div>
        <div class="subtitulo">Connected to Supabase Realtime</div>

        <div class="card-principal">
            <div class="label-atual">Temperatura Atual</div>
            <div class="display-temperatura" id="temp-atual">...°C</div>
        </div>

        <div class="card-grafico">
            <div class="grafico-header">📈 Histórico Recente (°C)</div>
            <div class="chart-container">
                <canvas id="graficoTemperatura"></canvas>
            </div>
        </div>

        <div class="grid-status">
            <div class="mini-card">
                <div class="mini-label">🔺 Pico de Calor</div>
                <div class="mini-valor" id="max-valor">...°C</div>
                <div class="mini-hora" id="max-hora">--:--</div>
            </div>
            <div class="mini-card">
                <div class="mini-label">🔹 Pico de Frio</div>
                <div class="mini-valor" id="min-valor">...°C</div>
                <div class="mini-hora" id="min-hora">--:--</div>
            </div>
        </div>

        <button class="btn-reset" onclick="limparBancoComSenha()">
            🗑️ Resetar Leituras do Banco
        </button>

        <div class="footer-status">
            <div class="desenvolvedor-info">
                <span>Desenvolvido por <strong>Raphael Furtado da Silva</strong></span>
                <span>Bolsista CNPq</span>
                
                <div class="logos-container">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/b/b3/CNPq_logo.svg" alt="Símbolo CNPq" class="logo-instituicao" title="CNPq">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/e/e8/Inmetro_logo.svg" alt="Símbolo Inmetro" class="logo-instituicao" title="Inmetro">
                </div>
            </div>
            
            2026
            
            <div class="fonte-dados">
                Fonte de Dados: <span>⚡ Supabase Database</span>
            </div>
        </div>
    </div>

    <script>
        const SENHA_MESTRA = "0101";

        const SUPABASE_URL = "https://wfhwtuopsyzdygmzxhay.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndmaHd0dW9wc3l6ZHlnbXp4aGF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ1MzQ5NTgsImV4cCI6MjEwMDExMDk1OH0._MrU4Ho80BTBZVI-Bmf_H_F9HnEJ082jC-9HwswQn2A";

        const bancoDados = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let historico = [];
        let graficoChart = null;

        function formatarHora(dataISO) {
            if (!dataISO) return "--:--";
            const data = new Date(dataISO);
            return data.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        }

        function inicializarGrafico() {
            const ctx = document.getElementById('graficoTemperatura').getContext('2d');
            
            const gradient = ctx.createLinearGradient(0, 0, 0, 180);
            gradient.addColorStop(0, 'rgba(255, 107, 74, 0.4)');
            gradient.addColorStop(1, 'rgba(255, 107, 74, 0.0)');

            graficoChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Temperatura (°C)',
                        data: [],
                        borderColor: '#ff6b4a',
                        borderWidth: 2,
                        backgroundColor: gradient,
                        fill: true,
                        tension: 0.3,
                        pointRadius: 3,
                        pointBackgroundColor: '#ff4071'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: {
                            grid: { color: '#222' },
                            ticks: { color: '#666', font: { size: 10 } }
                        },
                        y: {
                            grid: { color: '#222' },
                            ticks: { color: '#666', font: { size: 10 } }
                        }
                    }
                }
            });
        }

        function atualizarGrafico() {
            if (!graficoChart) return;
            const ultimosRegistros = historico.slice(-15);
            graficoChart.data.labels = ultimosRegistros.map(item => formatarHora(item.created_at));
            graficoChart.data.datasets[0].data = ultimosRegistros.map(item => item.temperatura);
            graficoChart.update();
        }

        function calcularEAtualizar() {
            if (historico.length > 0) {
                const registroAtual = historico[historico.length - 1];
                document.getElementById('temp-atual').innerText = registroAtual.temperatura.toFixed(1) + "°C";

                let maxObj = historico[0];
                let minObj = historico[0];

                for (let i = 1; i < historico.length; i++) {
                    if (historico[i].temperatura > maxObj.temperatura) {
                        maxObj = historico[i];
                    }
                    if (historico[i].temperatura < minObj.temperatura) {
                        minObj = historico[i];
                    }
                }

                document.getElementById('max-valor').innerText = maxObj.temperatura.toFixed(1) + "°C";
                document.getElementById('max-hora').innerText = "às " + formatarHora(maxObj.created_at);

                document.getElementById('min-valor').innerText = minObj.temperatura.toFixed(1) + "°C";
                document.getElementById('min-hora').innerText = "às " + formatarHora(minObj.created_at);
            } else {
                document.getElementById('temp-atual').innerText = "...°C";
                document.getElementById('max-valor').innerText = "...°C";
                document.getElementById('max-hora').innerText = "--:--";
                document.getElementById('min-valor').innerText = "...°C";
                document.getElementById('min-hora').innerText = "--:--";
            }

            atualizarGrafico();
        }

        async function carregarDadosIniciais() {
            let { data, error } = await bancoDados
                .from('leituras')
                .select('*')
                .order('created_at', { ascending: true })
                .limit(100);

            if (data && data.length > 0) {
                historico = data;
                calcularEAtualizar();
            } else if (error) {
                console.error("Erro ao conectar ao banco:", error);
            }
        }

        async function limparBancoComSenha() {
            const senhaInserida = prompt("🔒 Ação Restrita! Digite a senha mestra para apagar o banco:");

            if (senhaInserida === null) return;

            if (senhaInserida.trim() !== SENHA_MESTRA) {
                alert("❌ Senha incorreta! Operação cancelada.");
                return;
            }

            if (!confirm("⚠️ Atencão: Tem certeza de que deseja apagar permanentemente todas as leituras?")) return;

            const { error } = await bancoDados
                .from('leituras')
                .delete()
                .neq('temperatura', -999);

            if (error) {
                alert("❌ Erro ao apagar dados. Verifique as regras de RLS no Supabase.");
            } else {
                alert("✅ Registros apagados!");
                historico = [];
                calcularEAtualizar
